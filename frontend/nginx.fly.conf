server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fly private DNS. A variable in proxy_pass forces a lookup per request.
    resolver [fdaa::3] valid=10s ipv6=on;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $api_host app.process.ctk-api.internal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$api_host:8000;
    }

    location /health {
        set $api_host app.process.ctk-api.internal;
        proxy_pass http://$api_host:8000/health;
        proxy_set_header Host $host;
    }
}
