app = "ctk-web"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    NGINX_CONF = "nginx.fly.conf"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
